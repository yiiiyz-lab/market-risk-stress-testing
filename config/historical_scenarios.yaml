historical_scenarios:

  covid_crash:
    name: "COVID-19 Market Crash"
    start_date: "2020-02-19"
    end_date: "2020-03-23"
    description: >
      Sharp global risk-off episode during the initial COVID-19
      market sell-off.

  inflation_selloff_2022:
    name: "2022 Inflation / Rates Sell-Off"
    start_date: "2022-01-03"
    end_date: "2022-10-14"
    description: >
      Equity and fixed-income drawdown associated with high inflation
      and rapid repricing of interest rates.

  regional_banking_stress:
    name: "2023 Regional Banking Stress"
    start_date: "2023-03-08"
    end_date: "2023-03-24"
    description: >
      Risk-off episode surrounding stress in the U.S. regional
      banking sector.